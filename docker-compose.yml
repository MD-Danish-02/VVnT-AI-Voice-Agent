services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vvnt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vvnt_voice_agent
      POSTGRES_USER: vvnt_user
      POSTGRES_PASSWORD: vvnt_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: